<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentHub v0.7 - Supabase Data Integration</title>
  <style>
    :root{
      --bg:#0b0d14;--panel:#121620;--panel2:#181d29;--panel3:#202636;
      --border:#2a3142;--text:#f4f6fb;--muted:#9099ad;--purple:#7c68ff;
      --purple2:#a79aff;--cyan:#48c9ff;--green:#4ade80;--orange:#fbbf24;--red:#fb7185;
      --sidebar:300px;--rail:72px;--right:285px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100%}
    button,input,textarea,select{font:inherit}
    button{cursor:pointer}
    .app{display:grid;grid-template-columns:var(--rail) var(--sidebar) minmax(0,1fr);height:100vh;overflow:hidden}
    .rail{background:#080a10;border-right:1px solid var(--border);padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:10px}
    .brand,.company-icon,.add-icon{width:48px;height:48px;border-radius:16px;border:1px solid var(--border);display:grid;place-items:center;background:var(--panel2);color:#fff;font-weight:800;transition:.15s}
    .brand{background:linear-gradient(145deg,var(--purple),#5140c8);border:0;font-size:18px}
    .company-icon.active{border-color:var(--purple);box-shadow:0 0 0 2px #7c68ff33;background:#211d3d}
    .company-icon:hover,.add-icon:hover{transform:translateY(-1px);border-color:#59627a}
    .rail-sep{height:1px;background:var(--border);width:34px}
    .add-icon{color:var(--green);font-size:24px}
    .sidebar{background:#0e1119;border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0}
    .company-head{padding:18px;border-bottom:1px solid var(--border)}
    .company-head h2{margin:0;font-size:17px}.company-head small{color:var(--muted)}
    .side-scroll{overflow:auto;padding:14px 10px 24px}
    .section{margin-bottom:22px}
    .section-title{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.08em;padding:0 9px 8px}
    .nav-item{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;color:#c7ccda;text-align:left;padding:9px 10px;border-radius:8px;margin:2px 0}
    .nav-item:hover{background:var(--panel2);color:#fff}.nav-item.active{background:#26213e;color:#fff}
    .nav-item .dot{width:9px;height:9px;border-radius:50%;background:var(--purple)}
    .nav-item.add{color:var(--muted)}
    .nav-item.danger{color:var(--red)}
    .main{display:grid;grid-template-rows:64px minmax(0,1fr);min-width:0;overflow:hidden}
    .topbar{border-bottom:1px solid var(--border);background:#0e1119;display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:14px}
    .top-title{min-width:0}.top-title strong{display:block;font-size:17px}.top-title span{font-size:12px;color:var(--muted)}
    .tabs{display:flex;gap:6px;flex-wrap:wrap}.tab{border:1px solid transparent;background:transparent;color:var(--muted);padding:8px 12px;border-radius:8px}
    .tab:hover{background:var(--panel2);color:#fff}.tab.active{background:#282241;color:#fff;border-color:#41376b}
    .view{min-height:0;overflow:hidden}
    .chat-layout{height:100%;display:grid;grid-template-columns:minmax(0,1fr) var(--right)}
    .chat-main{min-width:0;display:grid;grid-template-rows:minmax(0,1fr) auto}
    .messages{overflow:auto;padding:24px 28px 14px}
    .msg{display:grid;grid-template-columns:42px minmax(0,1fr);gap:12px;margin-bottom:22px}
    .avatar{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:800;background:var(--panel3)}
    .msg-head{display:flex;align-items:baseline;gap:8px}.msg-head strong{font-size:14px}.msg-head small{color:var(--muted);font-size:10px}
    .msg-body{color:#d7dbea;line-height:1.55;margin-top:4px;white-space:pre-wrap}
    .composer-wrap{padding:12px 18px 18px;background:linear-gradient(transparent,#0b0d14 18%)}
    .quick-actions{display:flex;gap:7px;margin-bottom:8px;flex-wrap:wrap}
    .mini-btn,.primary,.secondary,.danger-btn{border:1px solid var(--border);background:var(--panel2);color:#dce0ec;padding:8px 11px;border-radius:8px}
    .mini-btn:hover,.secondary:hover{border-color:#566079;background:#202638}
    .primary{background:var(--purple);border-color:var(--purple);color:#fff;font-weight:700}
    .primary:hover{filter:brightness(1.08)}
    .danger-btn{border-color:#6a3340;color:#ff9aad;background:#28151b}
    .composer{display:flex;gap:9px;border:1px solid var(--border);background:var(--panel);padding:9px;border-radius:12px}
    .composer textarea{flex:1;resize:none;min-height:44px;max-height:120px;background:transparent;border:0;outline:0;color:#fff;padding:8px}
    .rightbar{border-left:1px solid var(--border);background:#0e1119;padding:18px;overflow:auto}
    .rightbar h4{font-size:11px;color:var(--muted);letter-spacing:.08em;margin:8px 0 10px}
    .member{display:flex;align-items:center;gap:9px;margin:10px 0}.member .avatar{width:32px;height:32px;border-radius:10px;font-size:12px}
    .stat{background:var(--panel2);border:1px solid var(--border);padding:11px;border-radius:10px;margin-top:8px}
    .stat span{color:var(--muted);font-size:11px}.stat strong{display:block;margin-top:4px}
    .board-shell{height:100%;display:grid;grid-template-columns:210px minmax(0,1fr) 300px;min-width:0}
    .toolbox,.inspector{background:#0e1119;padding:14px;border-right:1px solid var(--border);overflow:auto}
    .inspector{border-right:0;border-left:1px solid var(--border)}
    .toolbox h4,.inspector h4{font-size:11px;color:var(--muted);letter-spacing:.08em;margin:8px 0 12px}
    .tool{width:100%;text-align:left;border:1px solid var(--border);background:var(--panel2);color:#e6e8ef;border-radius:9px;padding:10px;margin-bottom:8px}
    .tool:hover{border-color:#59627a}
    .canvas-wrap{position:relative;overflow:hidden;background-color:#0b0e16;background-image:radial-gradient(#31384a 1px,transparent 1px);background-size:22px 22px;touch-action:none}
    .canvas-world{position:absolute;left:0;top:0;transform-origin:0 0;width:2400px;height:1600px}
    .edge-layer{position:absolute;inset:0;width:2400px;height:1600px;overflow:visible;pointer-events:none}
    .edge-layer path{fill:none;stroke:#6d7690;stroke-width:3}
    .edge-layer path.loop{stroke:var(--orange);stroke-dasharray:9 7}
    .node{position:absolute;width:190px;min-height:88px;border:1px solid var(--border);background:var(--panel2);border-radius:13px;padding:12px;box-shadow:0 10px 28px #0004;user-select:none;touch-action:none}
    .node.selected{border-color:var(--purple);box-shadow:0 0 0 2px #7c68ff33,0 12px 30px #0005}
    .node-title{font-weight:800;font-size:13px}.node-sub{font-size:11px;color:var(--muted);margin-top:5px}
    .node-status{font-size:10px;margin-top:8px;color:var(--cyan)}
    .port{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--purple);border:2px solid #c7c0ff;top:50%;transform:translateY(-50%)}
    .port.in{left:-8px}.port.out{right:-8px;cursor:crosshair}
    .node.decision{border-color:#326a7b}.node.approval{border-color:#7a6531}.node.loop-node{border-color:#517050}
    .canvas-controls{position:absolute;right:14px;bottom:14px;display:flex;gap:7px;z-index:20}
    .canvas-controls button{width:38px;height:38px;border-radius:9px;border:1px solid var(--border);background:#151a26;color:#fff}
    .field{margin-bottom:13px}.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:6px}
    .field input,.field textarea,.field select{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:#fff;padding:9px;outline:none}
    .field textarea{min-height:84px;resize:vertical}
    .checks label{display:flex;align-items:center;gap:8px;color:#d5d9e5;margin:8px 0;font-size:12px}
    .empty{display:grid;place-items:center;height:100%;color:var(--muted);text-align:center;padding:30px}
    .modal-backdrop{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:100}
    .modal-backdrop.open{display:flex}.modal{width:min(520px,calc(100vw - 32px));max-height:88vh;overflow:auto;background:#121620;border:1px solid var(--border);border-radius:16px;padding:20px}
    .modal h3{margin:0 0 18px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
    .toast{position:fixed;right:18px;bottom:18px;background:#202637;border:1px solid #46506a;color:#fff;padding:11px 14px;border-radius:10px;z-index:200;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}
    .toast.show{opacity:1;transform:none}
    .badge{display:inline-block;padding:3px 7px;border-radius:999px;font-size:9px;background:#2b2546;color:#c9c2ff}
    .hint{font-size:11px;color:var(--muted);line-height:1.5}
    .sep{height:1px;background:var(--border);margin:14px 0}
    @media(max-width:1000px){:root{--sidebar:230px;--right:230px}.board-shell{grid-template-columns:170px minmax(0,1fr) 250px}}
    @media(max-width:780px){.app{grid-template-columns:58px 190px minmax(0,1fr)}:root{--rail:58px;--sidebar:190px}.rightbar{display:none}.chat-layout{grid-template-columns:1fr}.board-shell{grid-template-columns:150px minmax(0,1fr)}.inspector{display:none}.tabs{gap:2px}.tab{padding:7px}}

    /* Supabase authentication */
    .auth-screen{position:fixed;inset:0;z-index:500;background:var(--bg);display:grid;place-items:center;padding:24px}
    .auth-screen.hidden{display:none}
    .auth-card{width:min(420px,100%);background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:28px;box-shadow:0 24px 70px #0007}
    .auth-logo{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,var(--purple),#5140c8);font-weight:900;margin-bottom:18px}
    .auth-card h1{font-size:24px;margin:0 0 6px}.auth-card>p{color:var(--muted);margin:0 0 22px;font-size:13px}
    .auth-card .field input{height:44px}.auth-submit{width:100%;height:44px;margin-top:4px}
    .auth-switch{text-align:center;color:var(--muted);font-size:12px;margin-top:16px}.auth-switch button,.auth-link{border:0;background:none;color:var(--purple2);padding:0;cursor:pointer}.auth-link-row{text-align:right;margin:-5px 0 12px;font-size:12px}.auth-link:hover,.auth-switch button:hover{text-decoration:underline}
    .auth-message{display:none;margin:12px 0 0;padding:10px;border-radius:8px;font-size:12px;line-height:1.45}.auth-message.show{display:block}.auth-message.error{background:#28151b;color:#ff9aad;border:1px solid #6a3340}.auth-message.success{background:#13251b;color:#8ef0ad;border:1px solid #315c40}
    .user-menu{display:flex;align-items:center;gap:8px}.user-email{font-size:11px;color:var(--muted);max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  </style>
</head>
<body>
<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">AH</div>
    <h1 id="authTitle">Welcome back</h1>
    <p id="authSubtitle">Sign in to your AgentHub workspace.</p>
    <form id="authForm">
      <div class="field"><label>Email</label><input id="authEmail" type="email" autocomplete="email" required placeholder="you@example.com"></div>
      <div class="field" id="passwordField"><label>Password</label><input id="authPassword" type="password" autocomplete="current-password" required minlength="6" placeholder="••••••••"></div>
      <div class="field" id="confirmPasswordField" style="display:none"><label>Confirm Password</label><input id="authPasswordConfirm" type="password" autocomplete="new-password" minlength="6" placeholder="••••••••"></div>
      <div class="auth-link-row" id="forgotRow"><button class="auth-link" type="button" id="forgotPasswordBtn">Forgot password?</button></div>
      <button class="primary auth-submit" id="authSubmit" type="submit">Sign In</button>
      <div class="auth-message" id="authMessage"></div>
    </form>
    <div class="auth-switch"><span id="authSwitchText">New to AgentHub?</span> <button type="button" id="authSwitchBtn">Create account</button></div>
  </div>
</div>

<div class="app" id="app" style="display:none">
  <aside class="rail">
    <button class="brand" title="AgentHub">AH</button>
    <div class="rail-sep"></div>
    <div id="companyRail"></div>
    <button class="add-icon" id="addCompanyBtn" title="Create company">+</button>
  </aside>

  <aside class="sidebar">
    <div class="company-head">
      <h2 id="companyName">AgentHub</h2>
      <small id="companyMeta">AI Organization</small>
    </div>
    <div class="side-scroll">
      <section class="section">
        <div class="section-title">PROJECTS</div>
        <div id="projectList"></div>
        <button class="nav-item add" id="addProjectBtn">＋ New Project</button>
      </section>
      <section class="section">
        <div class="section-title">AI EMPLOYEES</div>
        <div id="agentList"></div>
        <button class="nav-item add" id="hireAgentBtn">＋ Hire AI Employee</button>
      </section>
      <section class="section">
        <div class="section-title">COMPANY TOOLS</div>
        <button class="nav-item" data-view="organization">◫ Organization Board</button>
        <button class="nav-item" data-view="workflow">⌁ Workflow Builder</button>
      </section>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="top-title">
        <strong id="topTitle"># Product Launch</strong>
        <span id="topSubtitle">AI team workspace</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <nav class="tabs">
          <button class="tab active" data-view="chat">Chat</button>
          <button class="tab" data-view="organization">Organization</button>
          <button class="tab" data-view="workflow">Workflow</button>
        </nav>
        <div class="user-menu"><span class="user-email" id="userEmail"></span><button class="secondary" id="signOutBtn">Sign out</button></div>
      </div>
    </header>
    <section class="view" id="view"></section>
  </main>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h3 id="modalTitle">Create</h3>
    <form id="modalForm"></form>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    const companyIds=state.companies.map(c=>c.id);
    if(!companyIds.length){state.projects=[];state.agents=[];state.projectAgents=[];state.messages=[];
      state.orgNodes=[];state.orgEdges=[];state.workflows=[];state.workflowNodes=[];state.workflowEdges=[];render();return;}
    const [pr,ag,pa,ms,boards]=await Promise.all([
      supabaseClient.from("projects").select("*").in("company_id",companyIds).order("created_at"),
      supabaseClient.from("agents").select("*").in("company_id",companyIds).order("created_at"),
      supabaseClient.from("project_agents").select("project_id,agent_id"),
      supabaseClient.from("messages").select("*").order("created_at",{ascending:true}).limit(1000),
      supabaseClient.from("workspace_documents").select("company_id,document_key,document")
        .in("company_id",companyIds)
    ]);
    for(const result of [pr,ag,pa,ms,boards])throwIfError(result);
    if(seq!==workspaceLoadSeq)return;
    state.projects=pr.data.map(dbProject);state.agents=ag.data.map(dbAgent);
    const projectIds=new Set(state.projects.map(p=>p.id));
    const agentIds=new Set(state.agents.map(a=>a.id));
    state.projectAgents=pa.data.filter(x=>projectIds.has(x.project_id)&&agentIds.has(x.agent_id))
      .map(x=>({projectId:x.project_id,agentId:x.agent_id}));
    state.messages=ms.data.filter(x=>projectIds.has(x.project_id)).map(dbMessage);
    for(const key of ["orgNodes","orgEdges","workflows","workflowNodes","workflowEdges"])state[key]=[];
    for(const row of boards.data){const d=row.document||{};
      if(row.document_key==="organization"){
        state.orgNodes.push(...(Array.isArray(d.nodes)?d.nodes:[]).filter(x=>x.companyId===row.company_id));
        state.orgEdges.push(...(Array.isArray(d.edges)?d.edges:[]).filter(x=>x.companyId===row.company_id));
      }else if(row.document_key==="workflows"){
        state.workflows.push(...(Array.isArray(d.workflows)?d.workflows:[]));
        state.workflowNodes.push(...(Array.isArray(d.nodes)?d.nodes:[]));
        state.workflowEdges.push(...(Array.isArray(d.edges)?d.edges:[]));
      }
    }
    if(!state.projects.some(p=>p.id===state.activeProjectId))
      state.activeProjectId=state.projects.find(p=>p.companyId===state.activeCompanyId)?.id||null;
    render();
  }
  async function persistBoard(companyId=state.activeCompanyId){
    if(!companyId||!currentUser)return;
    const projects=state.projects.filter(p=>p.companyId===companyId);
    const projectIds=new Set(projects.map(p=>p.id));
    const workflows=state.workflows.filter(w=>projectIds.has(w.projectId));
    const wfIds=new Set(workflows.map(w=>w.id));
    const docs=[
      {company_id:companyId,document_key:"organization",document:{
        nodes:state.orgNodes.filter(x=>x.companyId===companyId),edges:state.orgEdges.filter(x=>x.companyId===companyId)}},
      {company_id:companyId,document_key:"workflows",document:{workflows,
        nodes:state.workflowNodes.filter(x=>wfIds.has(x.workflowId)),
        edges:state.workflowEdges.filter(x=>wfIds.has(x.workflowId))}}
    ];
    throwIfError(await supabaseClient.from("workspace_documents").upsert(docs,{onConflict:"company_id,document_key"}));
  }

  // Real AI MVP: one assigned agent replies through a protected Supabase Edge Function.
  // Projects, agents and messages are still stored in this browser's localStorage.
  let aiBusy=false;
  let aiRequestId=0;
  async function sendMessage(){
    if(aiBusy){toast("Wait for the current AI reply.");return;}
    const input=el("messageInput"), text=input?.value.trim();
    if(!text)return;
    if(text.length>4000){toast("Message is too long (max 4,000 characters).");return;}
    const p=project(), c=company();
    if(!p||!c){toast("Create a company and project first.");return;}
    const agents=projectAgents();
    const mentioned=agents.find(a=>text.toLowerCase().includes("@"+a.name.toLowerCase()));
    const responder=mentioned||agents.find(a=>a.role.toLowerCase()==="ceo")||agents[0];
    if(!responder){toast("Hire an AI Employee for this project first.");return;}
    const companyId=c.id, projectId=p.id;
    try{
      const row=throwIfError(await supabaseClient.from("messages").insert({
        project_id:projectId,sender_type:"user",sender_user_id:currentUser.id,content:text
      }).select().single());
      state.messages.push(dbMessage(row));
    }catch(err){notifyError("Message save failed",err);return;}
    input.value=""; save();
    aiBusy=true;
    const requestId=++aiRequestId;
    renderChat();
    try{
      const history=state.messages.filter(m=>m.projectId===projectId).slice(-12).map(m=>({
        role:m.senderType==="human"?"user":"assistant",content:String(m.content).slice(0,4000)
      }));
      const {data,error}=await supabaseClient.functions.invoke("agent-chat",{
        body:{company_id:companyId,agent:{name:responder.name,role:responder.role,prompt:responder.prompt},messages:history}
      });
      if(requestId!==aiRequestId)return;
      if(error){
        let detail=error.message;
        try{const body=await error.context?.json();if(body?.error)detail=body.error;}catch{}
        throw new Error(detail||"Edge Function request failed");
      }
      if(!data?.reply)throw new Error(data?.error||"AI returned no reply");
      state.messages.push({id:uid("m"),projectId,senderType:"agent",agentId:responder.id,senderName:responder.name,content:data.reply,time:now()});
      save();
    }catch(err){
      if(requestId===aiRequestId){console.error("AI request failed",err);toast("AI error: "+(err?.message||"Unknown error"));}
    }finally{
      if(requestId===aiRequestId){aiBusy=false;if(state.activeView==="chat")renderChat();}
    }
  }

  function autoLayoutOrg(){
    const nodes=state.orgNodes.filter(n=>n.companyId===state.activeCompanyId);
    const edges=state.orgEdges.filter(e=>e.companyId===state.activeCompanyId);
    const targets=new Set(edges.map(e=>e.targetAgentId));
    const roots=nodes.filter(n=>!targets.has(n.agentId));
    const root=roots[0]||nodes[0]; if(!root)return;
    root.x=520;root.y=100;
    const children=nodes.filter(n=>edges.some(e=>e.sourceAgentId===root.agentId&&e.targetAgentId===n.agentId));
    children.forEach((n,i)=>{n.x=180+i*300;n.y=360});
    const rest=nodes.filter(n=>n!==root&&!children.includes(n));
    rest.forEach((n,i)=>{n.x=260+i*280;n.y=620});
    scheduleBoardSave();renderOrganization();
  }

  }

  function renderEdgeInspector(kind,edgeId){
    const arr=kind==="org"?state.orgEdges:state.workflowEdges, e=arr.find(x=>x.id===edgeId); if(!e)return;
    const box=el(kind==="org"?"orgInspector":"wfInspector");
    if(kind==="org"){
      const s=state.agents.find(a=>a.id===e.sourceAgentId),t=state.agents.find(a=>a.id===e.targetAgentId);
      box.innerHTML=`<h4>RELATIONSHIP</h4><p><b>${esc(s?.name)}</b> → <b>${esc(t?.name)}</b></p>
        <div class="field"><label>Relationship</label><select id="reType">${["manages","delegates","reviews","communicates"].map(v=>`<option ${v===e.type?"selected":""}>${v}</option>`).join("")}</select></div>
        <div class="checks"><label><input id="reAssign" type="checkbox" ${e.assign?"checked":""}> Can assign tasks</label><label><input id="reReview" type="checkbox" ${e.review?"checked":""}> Can review</label><label><input id="reApprove" type="checkbox" ${e.approve?"checked":""}> Can approve</label></div>
        <button class="primary" id="saveRel">Save Relationship</button><button class="danger-btn" id="delRel" style="width:100%;margin-top:8px">Delete Relationship</button>`;
      el("saveRel").onclick=()=>{e.type=el("reType").value;e.assign=el("reAssign").checked;e.review=el("reReview").checked;e.approve=el("reApprove").checked;scheduleBoardSave();toast("Relationship updated");};
      el("delRel").onclick=()=>{state.orgEdges=state.orgEdges.filter(x=>x.id!==e.id);scheduleBoardSave();renderOrganization();};
    }else{
      box.innerHTML=`<h4>ARROW / ROUTE</h4>
        <div class="field"><label>Route Label</label><input id="eeLabel" value="${esc(e.label||"")}"></div>
        <div class="checks"><label><input id="eeLoop" type="checkbox" ${e.loop?"checked":""}> Feedback / loop edge</label></div>
        <div class="field"><label>Maximum loops / retries</label><input id="eeMax" type="number" min="1" max="20" value="${e.maxLoops||3}"></div>
        <button class="primary" id="saveEdge">Save Arrow</button><button class="danger-btn" id="delEdge" style="width:100%;margin-top:8px">Delete Arrow</button>`;
      el("saveEdge").onclick=()=>{e.label=el("eeLabel").value;e.loop=el("eeLoop").checked;e.maxLoops=Math.max(1,Math.min(20,+el("eeMax").value||3));scheduleBoardSave();renderWorkflow();};
      el("delEdge").onclick=()=>{state.workflowEdges=state.workflowEdges.filter(x=>x.id!==e.id);scheduleBoardSave();renderWorkflow();};
    }
  }

  const canvasState={org:{scale:1,tx:0,ty:0},wf:{scale:1,tx:0,ty:0}};
  function resetCanvas(kind){canvasState[kind]={scale:1,tx:0,ty:0};applyTransform(kind);}
  function applyTransform(kind){
    const st=canvasState[kind], world=el(kind==="org"?"orgWorld":"wfWorld");
    if(world)world.style.transform=`translate(${st.tx}px,${st.ty}px) scale(${st.scale})`;
  }

  function setupCanvas(kind,nodes,edges){
    const canvas=el(kind==="org"?"orgCanvas":"wfCanvas"), world=el(kind==="org"?"orgWorld":"wfWorld"), svg=el(kind==="org"?"orgEdges":"wfEdges");
    applyTransform(kind);
    let pan=null, drag=null, connect=null;

    const redraw=()=>{
      svg.innerHTML="";
      const nodeEls=[...world.querySelectorAll(".node")];
      const map=Object.fromEntries(nodeEls.map(x=>[x.dataset.node,x]));
      edges.forEach(e=>{
        let sId,tId;
        if(kind==="org"){
          const sn=nodes.find(n=>n.agentId===e.sourceAgentId),tn=nodes.find(n=>n.agentId===e.targetAgentId);
          sId=sn?.id;tId=tn?.id;
        } else {sId=e.source;tId=e.target;}
        const s=map[sId],t=map[tId]; if(!s||!t)return;
        const x1=parseFloat(s.style.left)+s.offsetWidth, y1=parseFloat(s.style.top)+s.offsetHeight/2;
        const x2=parseFloat(t.style.left), y2=parseFloat(t.style.top)+t.offsetHeight/2;
        const bend=Math.max(80,Math.abs(x2-x1)*.45);
        const path=document.createElementNS("http://www.w3.org/2000/svg","path");
        path.setAttribute("d",`M ${x1} ${y1} C ${x1+bend} ${y1}, ${x2-bend} ${y2}, ${x2} ${y2}`);
        if(e.loop)path.classList.add("loop");
        path.style.pointerEvents="stroke";path.dataset.edge=e.id;path.dataset.kind=kind;
        path.addEventListener("pointerdown",ev=>{ev.stopPropagation();renderEdgeInspector(kind,e.id);});
        svg.appendChild(path);
        if(e.label){
          const text=document.createElementNS("http://www.w3.org/2000/svg","text");
          text.setAttribute("x",(x1+x2)/2);text.setAttribute("y",(y1+y2)/2-8);text.setAttribute("fill",e.loop?"#fbbf24":"#aab2c5");text.setAttribute("font-size","12");text.textContent=e.label;svg.appendChild(text);
        }
      });
      if(connect){
        const s=map[connect.nodeId]; if(s){
          const x1=parseFloat(s.style.left)+s.offsetWidth,y1=parseFloat(s.style.top)+s.offsetHeight/2;
          const p=document.createElementNS("http://www.w3.org/2000/svg","path");
          p.setAttribute("d",`M ${x1} ${y1} C ${x1+90} ${y1}, ${connect.x-90} ${connect.y}, ${connect.x} ${connect.y}`);p.setAttribute("stroke","#7c68ff");p.setAttribute("stroke-width","3");p.setAttribute("fill","none");svg.appendChild(p);
        }
      }
    };
    redraw();

    world.querySelectorAll(".node").forEach(node=>{
      node.addEventListener("pointerdown",e=>{
        if(e.target.classList.contains("port"))return;
        e.stopPropagation();world.querySelectorAll(".node").forEach(n=>n.classList.remove("selected"));node.classList.add("selected");
        const id=node.dataset.node;
        if(kind==="org")renderOrgInspector(node.dataset.agent);else renderWorkflowInspector(id);
        drag={id,startX:e.clientX,startY:e.clientY,ox:parseFloat(node.style.left),oy:parseFloat(node.style.top),node};
        node.setPointerCapture(e.pointerId);
      });
      const out=node.querySelector(".port.out");
      out.addEventListener("pointerdown",e=>{e.stopPropagation();connect={nodeId:node.dataset.node,x:0,y:0};out.setPointerCapture(e.pointerId);});
      out.addEventListener("pointermove",e=>{
        if(!connect)return;const rect=world.getBoundingClientRect(),st=canvasState[kind];
        connect.x=(e.clientX-rect.left)/st.scale;connect.y=(e.clientY-rect.top)/st.scale;redraw();
      });
      out.addEventListener("pointerup",e=>{
        if(!connect)return;
        const target=document.elementFromPoint(e.clientX,e.clientY)?.closest(".node");
        if(target&&target.dataset.node!==connect.nodeId){
          if(kind==="org"){
            const sn=nodes.find(n=>n.id===connect.nodeId),tn=nodes.find(n=>n.id===target.dataset.node);
            if(sn&&tn&&!state.orgEdges.some(x=>x.companyId===state.activeCompanyId&&x.sourceAgentId===sn.agentId&&x.targetAgentId===tn.agentId))
              state.orgEdges.push({id:uid("oe"),companyId:state.activeCompanyId,sourceAgentId:sn.agentId,targetAgentId:tn.agentId,type:"manages",assign:true,review:false,approve:false});
          }else{
            const w=activeWorkflow();
            if(!state.workflowEdges.some(x=>x.workflowId===w.id&&x.source===connect.nodeId&&x.target===target.dataset.node))
              state.workflowEdges.push({id:uid("we"),workflowId:w.id,source:connect.nodeId,target:target.dataset.node,label:""});
          }
          scheduleBoardSave();
        }
        connect=null; kind==="org"?renderOrganization():renderWorkflow();
      });
    });

    world.addEventListener("pointermove",e=>{
      if(drag){
        const st=canvasState[kind], dx=(e.clientX-drag.startX)/st.scale,dy=(e.clientY-drag.startY)/st.scale;
        drag.node.style.left=Math.max(0,drag.ox+dx)+"px";drag.node.style.top=Math.max(0,drag.oy+dy)+"px";redraw();
      }
    });
    world.addEventListener("pointerup",()=>{
      if(drag){
        const n=nodes.find(x=>x.id===drag.id);if(n){n.x=parseFloat(drag.node.style.left);n.y=parseFloat(drag.node.style.top);scheduleBoardSave();}
        drag=null;
      }
    });

    canvas.addEventListener("pointerdown",e=>{
      if(e.target!==canvas)return;pan={x:e.clientX,y:e.clientY,tx:canvasState[kind].tx,ty:canvasState[kind].ty};canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener("pointermove",e=>{if(!pan)return;canvasState[kind].tx=pan.tx+e.clientX-pan.x;canvasState[kind].ty=pan.ty+e.clientY-pan.y;applyTransform(kind);});
    canvas.addEventListener("pointerup",()=>pan=null);
    canvas.addEventListener("wheel",e=>{e.preventDefault();const st=canvasState[kind];st.scale=Math.max(.4,Math.min(1.8,st.scale*(e.deltaY>0?.9:1.1)));applyTransform(kind);},{passive:false});
    el(kind==="org"?"orgZoomIn":"wfZoomIn").onclick=()=>{canvasState[kind].scale=Math.min(1.8,canvasState[kind].scale+.1);applyTransform(kind);};
    el(kind==="org"?"orgZoomOut":"wfZoomOut").onclick=()=>{canvasState[kind].scale=Math.max(.4,canvasState[kind].scale-.1);applyTransform(kind);};
    el(kind==="org"?"orgCenter":"wfCenter").onclick=()=>resetCanvas(kind);
  }

  const runtime={stop:false,timers:[]};
  function runWorkflow(workflowId){
    runtime.stop=false;runtime.timers.forEach(clearTimeout);runtime.timers=[];
    const nodes=state.workflowNodes.filter(n=>n.workflowId===workflowId);
    if(!nodes.length){toast("Add workflow steps first.");return;}
    toast("Simulated workflow started.");
    nodes.forEach((n,i)=>{
      const t=setTimeout(()=>{
        if(runtime.stop)return;
        document.querySelectorAll("[data-status]").forEach(x=>{if(x.dataset.status===n.id){x.textContent="● Running";x.style.color="#4ade80";}});
        const done=setTimeout(()=>{if(runtime.stop)return;const x=document.querySelector(`[data-status="${n.id}"]`);if(x){x.textContent="✓ Completed";x.style.color="#48c9ff";}},650);
        runtime.timers.push(done);
      },i*900);runtime.timers.push(t);
    });
  }

  function openModal(title,fields,onSubmit){
    el("modalTitle").textContent=title;
    el("modalForm").innerHTML=fields+`<div class="modal-actions"><button type="button" class="secondary" id="cancelModal">Cancel</button><button class="primary" type="submit">Save</button></div>`;
    el("modalBackdrop").classList.add("open");
    el("cancelModal").onclick=closeModal;
    el("modalForm").onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget).entries());const submit=e.currentTarget.querySelector('button[type="submit"]');submit.disabled=true;try{await onSubmit(data);closeModal();}catch(err){console.error(err);toast(err?.message||"Action failed");}finally{submit.disabled=false;}};
  }
  function closeModal(){el("modalBackdrop").classList.remove("open");}

  function createCompany(){
    openModal("Create Company",`
      <div class="field"><label>Company Name</label><input required name="name" placeholder="e.g. Nova Labs"></div>
      <div class="field"><label>Icon / Emoji</label><input name="icon" value="🏢"></div>
      <div class="field"><label>Description</label><input name="description" value="AI Organization"></div>`,
      async d=>{
        try{
          const name=d.name.trim();
          if(!name) throw new Error("Company name cannot be empty.");
          const {data,error}=await supabaseClient.rpc("create_company",{
            company_name:name,
            company_description:d.description?.trim()||null,
            company_icon:d.icon?.trim()||null
          });
          if(error) throw error;
          await loadCompaniesFromSupabase();
          state.activeCompanyId=data;
          state.activeProjectId=null;
          save();
          render();
          toast("Company created in Supabase.");
        }catch(err){
          console.error("Create company failed",err);
          toast("Create company failed: "+(err?.message||"Unknown error"));
        }
      }
    );
  }
  function createProject(){
    if(!state.activeCompanyId){toast("Create a company first.");return;}
    openModal("New Project",`
      <div class="field"><label>Project Name</label><input required name="name" placeholder="e.g. Product Launch"></div>
      <div class="field"><label>Description</label><textarea name="description"></textarea></div>`,
      async d=>{
        const row=throwIfError(await supabaseClient.from("projects").insert({
          company_id:state.activeCompanyId,name:d.name.trim(),description:d.description||"",created_by:currentUser.id
        }).select().single());
        state.projects.push(dbProject(row));state.activeProjectId=row.id;state.activeView="chat";render();
      });
  }
  function hireAgent(){
    if(!state.activeCompanyId){toast("Create a company first.");return;}
    openModal("Hire AI Employee",`
      <div class="field"><label>Name</label><input required name="name" placeholder="e.g. Alex"></div>
      <div class="field"><label>Role</label><input required name="role" placeholder="e.g. Engineer"></div>
      <div class="field"><label>Provider</label><select name="provider"><option>OpenAI</option><option>Anthropic</option><option>Google</option><option>OpenRouter</option></select></div>
      <div class="field"><label>Model</label><input name="model" placeholder="Model name"></div>
      <div class="field"><label>System Prompt</label><textarea name="prompt"></textarea></div>`,
      async d=>{
        const row=throwIfError(await supabaseClient.from("agents").insert({
          company_id:state.activeCompanyId,name:d.name.trim(),role:d.role.trim(),provider:d.provider,
          model:d.model||"Default",system_prompt:d.prompt||"",authority:"Specialist",
          decision_weight:50,permissions:["communicate"],created_by:currentUser.id
        }).select().single());
        const a=dbAgent(row);state.agents.push(a);
        const p=project();
        if(p){try{throwIfError(await supabaseClient.from("project_agents").insert({project_id:p.id,agent_id:a.id}));
          state.projectAgents.push({projectId:p.id,agentId:a.id});}catch(err){notifyError("Agent assignment failed",err);}}
        state.orgNodes.push({id:uid("on"),companyId:state.activeCompanyId,agentId:a.id,x:400,y:260});
        scheduleBoardSave();render();
      });
  }
  function editAgent(agentId){
    const a=state.agents.find(x=>x.id===agentId);if(!a)return;
    openModal("Edit AI Employee",`
      <div class="field"><label>Name</label><input required name="name" value="${esc(a.name)}"></div>
      <div class="field"><label>Role</label><input required name="role" value="${esc(a.role)}"></div>
      <div class="field"><label>Provider</label><select name="provider">${["OpenAI","Anthropic","Google","OpenRouter"].map(x=>`<option ${x===a.provider?"selected":""}>${x}</option>`).join("")}</select></div>
      <div class="field"><label>Model</label><input name="model" value="${esc(a.model)}"></div>
      <div class="field"><label>System Prompt</label><textarea name="prompt">${esc(a.prompt||"")}</textarea></div>
      <div class="field"><label>Assign to current project?</label><select name="assign"><option value="yes" ${project()&&state.projectAgents.some(x=>x.projectId===project().id&&x.agentId===a.id)?"selected":""}>Yes</option><option value="no">No</option></select></div>`,
      async d=>{
        throwIfError(await supabaseClient.from("agents").update({name:d.name.trim(),role:d.role.trim(),
          provider:d.provider,model:d.model,system_prompt:d.prompt}).eq("id",a.id).select().single());
        Object.assign(a,{name:d.name.trim(),role:d.role.trim(),provider:d.provider,model:d.model,prompt:d.prompt});
        const p=project();if(p){
          const exists=state.projectAgents.some(x=>x.projectId===p.id&&x.agentId===a.id);
          if(d.assign==="yes"&&!exists){throwIfError(await supabaseClient.from("project_agents").insert({project_id:p.id,agent_id:a.id}));state.projectAgents.push({projectId:p.id,agentId:a.id});}
          if(d.assign==="no"&&exists){throwIfError(await supabaseClient.from("project_agents").delete().eq("project_id",p.id).eq("agent_id",a.id));state.projectAgents=state.projectAgents.filter(x=>!(x.projectId===p.id&&x.agentId===a.id));}
        }render();
      });
  }

  document.addEventListener("click",e=>{
    const c=e.target.closest("[data-company]");if(c){state.activeCompanyId=c.dataset.company;const p=state.projects.find(p=>p.companyId===state.activeCompanyId);state.activeProjectId=p?.id||null;state.activeView="chat";render();return;}
    const p=e.target.closest("[data-project]");if(p){state.activeProjectId=p.dataset.project;state.activeView="chat";render();return;}
    const a=e.target.closest("[data-agent]");if(a){editAgent(a.dataset.agent);return;}
    const v=e.target.closest("[data-view]");if(v){state.activeView=v.dataset.view;render();return;}
  });
  el("addCompanyBtn").onclick=createCompany;
  el("addProjectBtn").onclick=createProject;
  el("hireAgentBtn").onclick=hireAgent;
  el("modalBackdrop").addEventListener("pointerdown",e=>{if(e.target===el("modalBackdrop"))closeModal();});

  const showAuthMessage=(message,type="error")=>{const box=el("authMessage");box.textContent=message;box.className=`auth-message show ${type}`;};
  const clearAuthMessage=()=>{const box=el("authMessage");box.textContent="";box.className="auth-message";};

  const setAuthMode=mode=>{
    authMode=mode; clearAuthMessage();
    const signup=mode==="signup", forgot=mode==="forgot", recovery=mode==="recovery";
    el("authTitle").textContent=signup?"Create your account":forgot?"Reset your password":recovery?"Choose a new password":"Welcome back";
    el("authSubtitle").textContent=signup?"Create an AgentHub account with your email.":forgot?"Enter your email and we’ll send you a secure reset link.":recovery?"Enter and confirm your new password.":"Sign in to your AgentHub workspace.";
    el("authSubmit").textContent=signup?"Create Account":forgot?"Send Reset Email":recovery?"Update Password":"Sign In";
    el("passwordField").style.display=forgot?"none":"block";
    el("authPassword").required=!forgot;
    el("confirmPasswordField").style.display=(signup||recovery)?"block":"none";
    el("authPasswordConfirm").required=signup||recovery;
    el("forgotRow").style.display=mode==="signin"?"block":"none";
    el("authEmail").closest(".field").style.display=recovery?"none":"block";
    el("authEmail").required=!recovery;
    el("authPassword").autocomplete=(signup||recovery)?"new-password":"current-password";
    el("authSwitchText").textContent=signup?"Already have an account?":forgot||recovery?"Back to login":"New to AgentHub?";
    el("authSwitchBtn").textContent=signup?"Sign in":forgot||recovery?"Sign in":"Create account";
  };

  let loadingUserId=null;
  const showApp=async user=>{if(loadingUserId===user?.id)return;loadingUserId=user?.id;currentUser=user;el("authScreen").classList.add("hidden");el("app").style.display="grid";el("userEmail").textContent=user?.email||"";try{await loadCompaniesFromSupabase();await loadWorkspace();}catch(err){console.error("Company load failed",err);toast("Company load failed: "+(err?.message||"Unknown error"));state.companies=[];state.activeCompanyId=null;}render();};
  const showLogin=()=>{loadingUserId=null;workspaceLoadSeq++;currentUser=null;state.projects=[];state.agents=[];state.projectAgents=[];state.messages=[];state.orgNodes=[];state.orgEdges=[];state.workflows=[];state.workflowNodes=[];state.workflowEdges=[];state.companies=[];el("app").style.display="none";el("authScreen").classList.remove("hidden");setAuthMode("signin");};

  el("authSwitchBtn").onclick=()=>{
    if(authMode==="signin")setAuthMode("signup");
    else setAuthMode("signin");
  };
  el("forgotPasswordBtn").onclick=()=>setAuthMode("forgot");

  el("authForm").onsubmit=async e=>{
    e.preventDefault(); clearAuthMessage();
    const email=el("authEmail").value.trim();
    const password=el("authPassword").value;
    const confirm=el("authPasswordConfirm").value;
    el("authSubmit").disabled=true;
    try{
      if(authMode==="signup"){
        if(password!==confirm)throw new Error("Passwords do not match.");
        const {data,error}=await supabaseClient.auth.signUp({email,password});
        if(error)throw error;
        if(data.session&&data.user){showApp(data.user);return;}
        showAuthMessage("Account created. Check your email and confirm your address, then sign in.","success");
      }else if(authMode==="forgot"){
        const redirectTo=window.location.href.split("#")[0].split("?")[0];
        const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo});
        if(error)throw error;
        showAuthMessage("If an account exists for this email, a password reset link has been sent. Check your inbox.","success");
      }else if(authMode==="recovery"){
        if(password!==confirm)throw new Error("Passwords do not match.");
        const {error}=await supabaseClient.auth.updateUser({password});
        if(error)throw error;
        showAuthMessage("Password updated successfully. You can now use your new password.","success");
        setTimeout(()=>showApp(currentUser),700);
      }else{
        const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
        if(error)throw error;
        showApp(data.user);
      }
    }catch(err){showAuthMessage(err?.message||"Authentication failed.");}
    finally{el("authSubmit").disabled=false;}
  };

  el("signOutBtn").onclick=async()=>{await supabaseClient.auth.signOut();showLogin();};

  supabaseClient.auth.onAuthStateChange((event,session)=>{
    if(event==="PASSWORD_RECOVERY"){
      currentUser=session?.user||null;
      el("app").style.display="none";
      el("authScreen").classList.remove("hidden");
      setAuthMode("recovery");
      return;
    }
    if(session?.user){
      currentUser=session.user;
      if(!["forgot","recovery"].includes(authMode))showApp(session.user);
    }else if(currentUser){showLogin();}
  });

  (async()=>{
    const {data:{session}}=await supabaseClient.auth.getSession();
    if(session?.user)showApp(session.user);else showLogin();
  })();
})();
</script>
</body>
</html>
